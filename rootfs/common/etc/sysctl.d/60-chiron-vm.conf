# Virtual memory tuning for a 3 GB board whose root is a compressed squashfs.
#
# Reclaiming a page of the root filesystem here does not just drop it: it
# guarantees a re-read through a loop device and a decompression the next time
# the page is touched, and this kernel serialises those decompressions. File
# pages are therefore expensive to lose in a way the default balance does not
# know about.

# Keep anonymous memory resident and let the file cache take the reclaim --
# but only mildly. This was first set to 100, reasoning that a squashfs page
# costs a decompression to recover, and that turned out to be the wrong end:
# with the speech model resident, 297 MB of a 441 MB working set was paged out
# during a dialogue and recognition never caught back up. A file page costs one
# decompression; an anonymous page of a model under active decoding costs the
# conversation.
vm.swappiness = 10

# Keep dentries and inodes around longer, for the same reason: rebuilding them
# means re-reading the squashfs.
vm.vfs_cache_pressure = 50
