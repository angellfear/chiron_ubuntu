# The Amlogic OP-TEE backend, which brings up /dev/tee0 and /dev/teepriv0.
#
# It carries an OF alias for the /optee node and would eventually autoload, but
# the supplicant is gated on the device node existing and everything that opens
# a session is gated on the supplicant. Loading it here puts that at a fixed
# point in the boot instead of leaving it to a udev event. modprobe pulls in
# tee.ko first; this module is therefore loaded explicitly.
optee
