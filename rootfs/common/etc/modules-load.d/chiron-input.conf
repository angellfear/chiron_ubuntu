# The board's physical controls: two resistor-coded volume keys on SAR ADC
# channel 2, and the camera-cover and microphone-mute sliders on GPIO.
#
# gpio_keys is built in, so the "switches" device appears on its own. The ADC
# keypad is not a standalone module on 5.15 -- it is part of the amlogic-input
# aggregate -- and nothing produces a modalias for it, so it is loaded by name.
amlogic_input
