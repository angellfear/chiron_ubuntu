# Load order for the Amlogic display stack, carried over from the
# integration, where it was established on this hardware.
#
# aml_drm allocates scanout buffers with dma_heap_find(). The board has no
# vendor dma-heaps, so meson_gem asks for "system", and that heap only exists
# once the modular system_heap has registered it: built in, the vendor tree
# silently fails to register it despite linking the initcall.
#
# aml_media brings up the media prerequisites aml_drm binds against, and needs
# drm_stack=1 to do the DRM-side initialisation rather than the Android one.
options aml_media drm_stack=1
softdep aml_drm pre: system_heap aml_media
