# Digitiser orientation, established on this hardware: load-himax.sh loads
# the module with exactly these values.
#
# swap_xy stays off: the controller already reports X then Y and the device tree
# ranges are 1200x1920, the same way round as the untransformed DSI mode.
# Swapping here would turn a horizontal finger movement into a vertical one
# before wlroots ever applies an output transform.
#
# Both inversions are on because the digitiser's origin is at the opposite
# corner from the panel's scanout origin. This belongs in the driver rather than
# in a libinput calibration matrix: the matrix is recomputed from the output
# transform on every rotation, and where the glass sits relative to the panel
# does not rotate with the image.
options himax_mmi swap_xy=0 invert_x=1 invert_y=1
