# The V4L2 M2M front end of the hardware decoder carries two parameters that
# are not its defaults and are not optional.
#
# multiplanar=1: the driver always advertises VIDEO_M2M_MPLANE, but its source
# default is false, which creates a legacy single-planar capture queue behind
# that multiplanar ABI. Standard clients then reach source-change successfully
# and get EINVAL from capture VIDIOC_REQBUFS. This keeps the advertised ABI and
# the VB2 queue type consistent.
#
# vp9_need_prefix=1: VP9 elementary-stream packets from generic V4L2 clients do
# not carry the private Amlogic frame header. Without this amvdec_ports does
# not add it, the hardware parser never reports picture info, and VP9 stalls at
# EOS.
options amvdec_ports multiplanar=1 vp9_need_prefix=1
