# The board's wf-shell configuration -- the panel along the bottom of the
# screen and the wallpaper behind it -- as the template accounts are seeded
# from, the same way wayfire.ini is.
#
# This build of wf-shell has no WF_SHELL_CONFIG_FILE support: it reads
# $XDG_CONFIG_HOME/wf-shell.ini and nothing else. Pointing XDG_CONFIG_HOME at
# /etc/wayfire is not a way around that -- wf-panel 0.10 creates
# $XDG_CONFIG_HOME/wf-shell/css/ at startup and aborts on the read-only /etc
# with `cannot create directories: Permission denied`, leaving the desktop with
# a wallpaper and no panel.
#
# chiron-firstboot used to link this file into ~/.config, which kept one file
# for the board but left it root-owned, so wcm could not save the panel either.
# It now copies, once. See /usr/local/bin/wayfire-session.
#
# Every key below appears in /usr/share/wayfire/metadata/wf-shell/*.xml. Keys
# that do not are silently ignored, which is how an earlier version of this file
# ended up having no effect at all.

[panel]
# Finger-sized rather than mouse-sized: 86 px is 79% taller than the previous
# 48 px panel on this touchscreen board.
position = bottom
autohide = false
minimal_height = 86

# No network widget here any more. It drew a second Wi-Fi indicator beside
# nm-applet's, which is the one that can actually do something: the widget only
# reports, and its click opened nm-connection-editor, where a network is added
# by typing its name. Two icons for one radio, and the useful one was not the
# one it was natural to press. The applet is started from wayfire.ini and still
# reaches that editor, under "Edit Connections...".
#
# The clock is the last thing on the right rather than centred: on a 1200 px
# wide panel a centred clock sits in the middle of the window list, and the
# corner is where a clock is looked for.
widgets_left = menu spacing4 window-list
widgets_center =
# The tray contains the SNI indicators from Chiron Control, Blueman and
# cpupower-gui. Notification bubbles are provided by the standard swaync
# daemon, not by wf-panel's optional notification widget: keeping both makes
# wf-panel win the D-Bus name and leaves the daemon unable to start.
# The Bluetooth manager remains available from the application
# menu; putting it in launchers as well would create a second, non-status
# Bluetooth icon.
#
# wf-panel is also the session's StatusNotifierWatcher, and the stock 0.8.0
# host stops listening to it when it loses a startup race with itself, which
# leaves this widget empty after a boot no matter how many clients register.
# chiron-tray-client works around it by waiting for the host name to exist.
widgets_right = tray spacing4 launchers spacing4 volume battery spacing4 clock

# A launcher is `launcher_<name> = <something>.desktop`, resolved through
# Gio::DesktopAppInfo: the icon, the label and the command all come out of the
# desktop entry, which is where a launcher is described on any other desktop.
#
# The other form the widget accepts is launcher_cmd_<name> plus
# launcher_icon_<name>, and it is a trap: that icon is opened as a *file path*,
# not looked up in the icon theme. `launcher_icon_osk = input-keyboard` -- the
# obvious spelling, and the one every other panel takes -- makes wf-panel log
#
#     Error loading file: input-keyboard
#     Failed to load icon input-keyboard
#
# and then drop the launcher entirely, so the button silently never appears.
launchers_size = 48
# wf-panel enumerates launcher keys lexicographically, not in file order, so
# the numeric names are what make this order the order on screen.
#
# Four, and each is something this board has no other one-tap route to: the
# browser, the file manager, a terminal, and the on-screen keyboard -- which
# nothing else can raise at all, because this session has no input-method
# client to notice a text field. Everything else stays in the menu.
#
# These name desktop entries that exist in this image: firefox and foot come
# from their packages, pcmanfm-qt is the file manager and the desktop, and
# chiron-keyboard.desktop is installed by the rootfs overlay next to the script
# it runs. A launcher whose desktop file is missing is logged and dropped, so
# an entry here is a claim that the application is installed.
launcher_01_browser = firefox.desktop
launcher_02_files = pcmanfm-qt.desktop
launcher_03_terminal = foot.desktop
launcher_04_keyboard = chiron-keyboard.desktop

menu_icon = /usr/share/wayfire/icons/wayfire.png
menu_fuzzy_search = true
menu_min_content_width = 600
menu_min_content_height = 900

# Time only. The date costs a third of the panel width on a 1200 px screen and
# is a hover away in any case.
clock_format = %H:%M
clock_font = sans 16

volume_icon_size = 48
battery_icon_size = 48
battery_status = 1
tray_icon_size = 48

# No [background] section: the wallpaper is not wf-shell's any more.
#
# wf-background is not started (see wayfire.ini) because pcmanfm-qt draws the
# desktop, and a desktop draws its own background. Two clients drawing a
# wallpaper would be two layer surfaces stacked on the same output.
#
# The wallpaper itself is /usr/local/share/chiron/wallpaper-portrait.png and
# -landscape.png, and chiron-autorotate chooses between them when the hinge
# moves.
