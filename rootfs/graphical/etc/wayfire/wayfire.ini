# The board's Wayfire configuration -- as the template every account starts
# from, not as the file the session reads.
#
# Wayfire has no compiled-in system config path: it reads $WAYFIRE_CONFIG_FILE,
# falling back to ~/.config/wayfire.ini. The session wrapper used to point that
# variable here, which made this the live file and made wcm unable to save a
# single setting, because the session user cannot write /etc. So the variable
# is unset, wayfire reads the account's own copy, and chiron-firstboot seeds
# that copy from this file the first time the account exists. The long version
# is in /usr/local/bin/wayfire-session.
#
# What that means for editing: changing this file changes what a *new* account
# gets. A board that is already running keeps its own copy, and the way to push
# a change to it is the same way a board is reset -- wipe the overlay.

[core]
# wayfire-shell is not optional here: it provides zwf_shell_manager_v2, without
# which wf-panel starts, connects, logs a warning and never maps a surface --
# the desktop comes up with a wallpaper and no panel. foreign-toplevel backs the
# panel's window list, gtk-shell the GTK client integration.
#
# vswipe and extra-gestures are what make the board usable without a keyboard:
# workspace switching and window actions from touch swipes.
plugins = \
  autostart \
  wayfire-shell \
  foreign-toplevel \
  gtk-shell \
  xdg-activation \
  command \
  move \
  resize \
  place \
  grid \
  window-rules \
  wm-actions \
  animate \
  decoration \
  expo \
  scale \
  vswitch \
  vswipe \
  extra-gestures \
  idle
preferred_decoration_mode = server

# The idle plugin stays loaded -- it is what handles idle-inhibit and the
# `toggle` activator -- but Chiron's idle policy is chiron-idle/swayidle (see
# idle-policy in [autostart]), and the plugin's own screensaver and DPMS must
# not run on top of it.
#
# screensaver_timeout defaults to 3600 in /usr/share/wayfire/metadata/idle.xml,
# and with no [idle] section here that default was live. One hour into the idle
# clock the plugin faded the output to a black composited frame: backlight still
# lit at its ALS value, connector still dpms=On, osd0 still scanning out, vsync
# still counting -- so the panel read as dead hardware while the compositor was
# simply drawing black. A touch dismissed it, which is why it looked like the
# clock itself was vanishing.
[idle]
screensaver_timeout = -1
dpms_timeout = -1

[autostart]
# Publish compositor environment into the systemd user manager and D-Bus session
# bus.  D-Bus activated services (portals, tray watchers) inherit the *bus*
# environment, not this compositor's.  Without this, xdg-desktop-portal-gtk
# exits 1 on every activation and the session has no file chooser or screencast.
# The key is named 0_env to sort before everything else.
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY

# The archive binary, and with XDG_CONFIG_HOME left alone.
#
# Pointing XDG_CONFIG_HOME at /etc/wayfire makes wf-panel find the system
# wf-shell.ini, which is what wf-shell 0.8 needed because it read its
# configuration from nowhere else. 0.10 does not only read that directory,
# it creates
# $XDG_CONFIG_HOME/wf-shell/css/ in it -- and /etc is read-only for the session
# user, so the panel died on startup with
#
#     unhandled exception (type std::exception) in signal handler:
#     what: filesystem error: cannot create directories: Permission denied
#           [/etc/wayfire/wf-shell/css/]
#
# and the desktop came up with a wallpaper and no panel. WF_SHELL_CONFIG_FILE is
# not an alternative: 0.10 does not carry the string at all. So the config
# directory stays the user's own writable one, and chiron-firstboot links
# ~/.config/wf-shell.ini to the system file.
#
# Two wf-shell patches are not here: a launcher `secondary` action and a tray
# host that keeps its watch. This image takes wf-shell from the archive like
# every other session package, so the tray may come up empty.
#
# wf-panel also aborts intermittently in cairo_surface_reference when wayfire
# mis-delivers a buffer release during layer-surface churn on its output -- a
# compositor/GTK race, not the panel's fault. chiron-panel respawns it so a
# crash is a flicker, not a dead desktop; the tray repopulates on its own.
autostart_wf_shell = false
panel = /usr/local/bin/chiron-panel
# The desktop: icons, a right click that offers something, and the wallpaper.
#
# This replaces wf-background, which drew the wallpaper and nothing else -- no
# icons, no desktop menu, and no way to add either. pcmanfm-qt draws all three
# as a layer-shell client, and it is the same program as the file manager, so
# the desktop and a folder window behave the same way.
#
# The wallpaper therefore moves out of wf-shell.ini and into pcmanfm-qt's own
# settings, which is also what makes it follow the hinge: chiron-autorotate
# sets it with `pcmanfm-qt --set-wallpaper` in the same place it sets the
# output transform. wf-background had a single `image` key and no idea the
# screen had turned.
# chiron-desktop-trust runs first, in the same command, because it has to
# finish before the desktop reads the launchers it is about to draw: an
# entry libfm-qt does not trust opens a dialog instead of running. See the
# script for why this cannot be done earlier than the session.
desktop = sh -c 'chiron-desktop-trust; exec pcmanfm-qt --desktop'

# The wrapper still uses the standard swayidle/wlopm protocols, but adds the
# user-selected action and coordinates screen-off with ambient auto-brightness.
# There must be exactly one swayidle owner: a second direct instance would race
# the saved timeout and could blank a clock that was selected instead.
idle-policy = /usr/local/bin/chiron-idle

# D-Bus activated portal (file chooser, screencast, screenshot).
portal = /usr/libexec/xdg-desktop-portal

# Notification daemon (org.freedesktop.Notifications).  Run the packaged user
# service rather than a second unmanaged process, so service health stays
# visible to systemd.  swaync rather than mako because Blueman's pairing
# confirmation is a notification with Confirm/Deny actions and mako renders no
# buttons for them -- see profiles/graphical/packages.list.
notifications = systemctl --user restart swaync.service

# Voice assistant.  31_nareth.sh enables this only for WITH_NARETH=1 builds.
# nareth = /usr/local/bin/nareth

# Bluetooth tray indicator (StatusNotifierItem).
blueman-settings = gsettings set org.blueman.general notification-daemon true
blueman-notification-settings = gsettings set org.blueman.general plugin-list "[]"
# W2 firmware is loaded and powered by chiron-bluetooth.service before BlueZ.
# Blueman's generic PowerManager must observe that state, not force a second
# Powered=true transition every time its applet starts: that duplicate request
# can wedge the UART firmware while leaving BlueZ's cached flags at "yes".
blueman-power-settings = gsettings set org.blueman.plugins.powermanager auto-power-on false
# blueman registers a tray icon, and the panel drops icons that register
# before its StatusNotifier host is up -- see /usr/local/bin/chiron-tray-client.
blueman = chiron-tray-client blueman-applet

# The hardware privacy switches and the light sensor, as tray items. The camera
# and microphone icons appear only while their switch is off, so on a normal
# session this adds one icon, not three. Behind chiron-tray-client for the same
# reason blueman is: an item that registers before the panel's StatusNotifier
# host exists is accepted and never drawn.
privacy = chiron-tray-client chiron-privacy

# Wi-Fi, as something a person can actually join from the screen. The panel has
# a network widget, but it only draws the current state and its click opens
# nm-connection-editor, which builds a connection from an SSID typed by hand:
# there is no list of what is in the air, so a board that ships without a
# Wi-Fi profile has no way onto a network at all. nm-applet is that list, and
# it is also NetworkManager's secret agent -- without one, a WPA network that
# needs a passphrase fails as "no secrets" with nothing asked.
#
# --indicator because the session is Wayland: the default GtkStatusIcon tray
# does not exist here, and without the flag the applet runs with no icon.
# Behind chiron-tray-client for the same reason as the two above.
network = chiron-tray-client nm-applet --indicator

# No cpupower-gui autostart. The comment this replaces promised a tray icon and
# a "Show GUI" item, and the archive package has neither: it ships a window, an
# application-menu entry and a privileged D-Bus helper, and no indicator at all.
# Service mode therefore held a background process for a tray that never
# appeared, which this board cannot spare. The governor is set at boot by
# chiron-cpufreq.service; the window is started from the application menu.

# Polkit agent -- without it, joining Wi-Fi etc. fails silently with
# "not authorized". Supervised, because autostart launches a process once and
# never brings it back, and an agent that has died is indistinguishable from a
# refusal; see the wrapper.
polkitagent = /usr/local/bin/chiron-polkit-agent

# The on-screen keyboard, started hidden and raised by the panel button.
#
# Nothing raises it on its own: that takes an input-method client speaking
# zwp_input_method_v2, which would have to be compiled separately and is not
# carried here. So a text field getting focus raises
# nothing, and asking for the keyboard is a deliberate tap on the launcher next
# to the tray, which runs the same script with `toggle`.
#
# Started here rather than on first use because starting it costs a layout
# parse and a surface, and because a keyboard that is already running keeps the
# layer -- Latin, Cyrillic, symbols -- the person last switched to.
keyboard = chiron-keyboard start

# Session readiness marker (hardware LED handoff only; no desktop UI).
session-ready = chiron-session-ready &

# The panel is a 1200x1920 MIPI DSI unit and scans out the right way round: no
# output transform. An earlier `transform = flipped` here was the sole cause of
# the mirrored desktop -- the OSD hardware applies no reflection of its own.
#
# What the vendor driver reports is easy to misread. /sys/kernel/debug/dri/0/
# osd*/osd_reverse shows the plane's DRM rotation mask, and the default value
# 1 is DRM_MODE_ROTATE_0, i.e. *no* reflection -- DRM_MODE_REFLECT_X and _Y are
# bits 4 and 5 (16 and 32), so a genuine 180 degree flip would read as 48. The
# debugfs node's own `echo 1` means "reverse xy" in the bootloader logo's
# encoding and writes 48; there is no input that restores DRM_MODE_ROTATE_0,
# so a board poked through that node needs a reboot to get back to the default.
#
# Scale is left at 1.0 -- the X11 session used --scale 0.7, which is not
# carried over.
[output:DSI-1]
mode = 1200x1920@60000
transform = normal
scale = 1.000000

[command]
# The board's only physical keys. The device tree declares exactly two on the
# ADC keypad -- key_name "vol+" "vol-", key_code 115 and 114 -- so these are
# KEY_VOLUMEUP and KEY_VOLUMEDOWN and nothing else needs binding.
#
# Use the standard PipeWire control utility directly for the two physical keys.
binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[input]
# Physical keyboards use the two layouts shown by the standard Ayatana tray
# indicator.  XKB owns the actual layout state; Alt+Shift changes that state
# for both native Wayland and Xwayland clients.
xkb_layout = us,ru
xkb_options = grp:alt_shift_toggle

# Touch calibration and the suppression of the driver's mouse-emulation device
# are done in udev (/etc/udev/rules.d/70-chiron-touch.rules), not here: that
# way they apply to every libinput consumer, X11 included, and survive a
# change of compositor.

[input-device:himax-touchscreen-mt]
# Bind the digitiser to the panel it is glued to. This is not redundant on a
# single-output board: an absolute device reports [0,1] in its own frame, and
# without a mapping wlroots stretches that across the output layout box and
# stops there. The box for a rotated output is 1920x1200, so the finger's long
# axis landed on the screen's long axis and the axes came out swapped in
# landscape -- portrait, where the two frames happen to agree, looked fine.
# Mapping the device makes wlroots apply the inverse of the output transform
# first, so touch follows chiron-autorotate around without anything else being
# told about the rotation.
output = DSI-1
