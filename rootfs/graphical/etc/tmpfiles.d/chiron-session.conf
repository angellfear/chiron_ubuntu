# /run/chiron is where board components leave their runtime markers.
# chiron-session-ready drops session-ready there once the visible shell is
# usable, and nothing creates the directory on its own.
#
# Mode and ownership are carried over unchanged: this directory is declared in
# the LED ring's tmpfiles because that component writes here too, and the ring
# runs as a member of `video`. Keeping the same line means the two do not have
# to be reconciled when the ring is ported.
d /run/chiron 0775 root video -
