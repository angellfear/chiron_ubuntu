# The Chiron sound card depends on three codec modules. The dummy codec has no
# modalias, so udev cannot discover it from the device tree; without an
# explicit pre-dependency the card repeatedly defers probing until the later
# systemd audio loader runs. Keep the codec DAIs registered before AUGE probes.
softdep amlogic_snd_soc pre: amlogic_snd_codec_dummy snd_soc_fs2105 snd_soc_es7210
