# A stereo view of the microphone array, beside the eight-channel one.
#
# The array is published by 51-chiron-pdm.conf as eight AUX channels, which is
# right for the wake word: it wants every microphone and downmixes them itself.
# It is unusable for everything else. AUX positions carry no spatial meaning, so
# PipeWire's channelmix has no rule for turning them into FL/FR or MONO and
# emits digital silence instead -- measured on the board as peak 0 over five
# seconds from the same device that gives peak 32375 when ALSA opens it directly.
# Anything that asks for an ordinary microphone -- an HFP uplink at mono 8 kHz,
# a browser, a recorder -- therefore records nothing at all.
#
# This was hit before and written down at the time: "mixing
# unpositioned channels down to stereo is not something PipeWire will do -- the
# result is a microphone that appears to work and records nothing". Its answer
# was to publish the PCM as two channels instead, which fixes ordinary clients
# by taking the array away from the wake word. This file keeps both: the raw
# eight-channel node stays exactly as it was, and the stereo node is derived
# from it inside PipeWire.
#
# Derived, not opened again -- that is the whole point. hw:0,3 is a single ALSA
# PCM and a second direct open would fail or lock the first client out. The
# capture stream below is an ordinary PipeWire stream on the existing node, so
# the wake word reading eight channels and a call reading two coexist the way
# any two clients of one source do.
#
# The graph sums the even-numbered microphones into the left channel and the
# odd-numbered ones into the right, a quarter gain each. Speech reaching four
# microphones is correlated and keeps its level; uncorrelated noise averages
# down by about 6 dB, which is the same reason the eight-channel node exists.
# Quarter gain also means four inputs cannot sum past full scale.
#
# node.passive on the capture side keeps this on demand. With nothing reading
# the stereo source the filter does not hold hw:0,3 open, so a direct ALSA
# capture of the raw array still succeeds -- which matters because holding the
# device permanently would take away the one escape hatch this board has when
# PipeWire itself is the thing being debugged.
#
# Measured on the board once this file was in place: mono at 8 kHz, which is
# exactly what an HFP uplink asks for, reads peak 30873 at 98% non-zero where
# it read a flat zero before; the raw eight-channel node and this one were
# read by two clients at the same time and both got audio.
#
# priority 2100 puts this node above the raw array's 2000 so it becomes the
# default source. That is the fix, restated: the default microphone has to be
# one that a client asking for mono can actually read.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Микрофон (стерео)"
      media.name        = "Микрофон (стерео)"
      filter.graph = {
        nodes = [
          { type = builtin name = mixL label = mixer
            control = { "Gain 1" = 0.25 "Gain 2" = 0.25
                        "Gain 3" = 0.25 "Gain 4" = 0.25 } }
          { type = builtin name = mixR label = mixer
            control = { "Gain 1" = 0.25 "Gain 2" = 0.25
                        "Gain 3" = 0.25 "Gain 4" = 0.25 } }
        ]
        # Capture channel order is AUX0..AUX7, so this alternates the array
        # between the two output channels rather than splitting it front/back.
        inputs = [ "mixL:In 1" "mixR:In 1" "mixL:In 2" "mixR:In 2"
                   "mixL:In 3" "mixR:In 3" "mixL:In 4" "mixR:In 4" ]
        outputs = [ "mixL:Out" "mixR:Out" ]
      }
      capture.props = {
        node.name      = "chiron_mic_stereo_input"
        # The raw array node from 51-chiron-pdm.conf. dont-remix keeps the
        # eight channels as they are: letting channelmix touch them here would
        # reintroduce the very silence this file exists to avoid.
        target.object      = "alsa_input.platform-auge_sound.capture.3.0"
        audio.position     = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 ]
        stream.dont-remix  = true
        node.passive        = true
      }
      playback.props = {
        node.name        = "chiron_mic_stereo"
        node.nick        = "Microphone"
        media.class      = "Audio/Source"
        audio.position   = [ FL FR ]
        priority.driver  = 2100
        priority.session = 2100
      }
    }
  }
]
