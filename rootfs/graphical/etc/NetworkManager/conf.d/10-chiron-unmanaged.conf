# The W2 driver registers three wifi interfaces, and only one of them is a
# client radio. ap0 and p2p0 exist for SoftAP and Wi-Fi Direct, which this
# appliance does not use; left managed they turn the applet's menu into three
# identical "Wi-Fi Networks / Available networks" branches, and the one that
# joins a network is not the first of them. Nothing in this image refers to
# either interface -- chiron-wifi-watchdog watches wlan0 -- so NetworkManager
# is told to leave them alone and the menu is left with one radio in it.
[keyfile]
unmanaged-devices=interface-name:ap0;interface-name:p2p0
