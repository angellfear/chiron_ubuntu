# The PDM microphone array, as all eight microphones and shared.
#
# WirePlumber's default ALSA profile picks two channels for this device, which
# is wrong twice over: the array has eight, and the wake word downmixes all of
# them for about 6 dB against uncorrelated noise that two cannot buy. Worse,
# it hides the failure this hardware actually has -- a dead lane of the array
# is four dead microphones, and you cannot see that in a two-channel node.
#
# The daemon used to open hw:0,3 directly, which took the device exclusively
# and locked every other application out of the microphone for as long as the
# wake word was listening -- which is always. Going through PipeWire makes it
# one client among several, and PipeWire is then the only thing arbitrating
# the hardware, which is the arrangement that can be reasoned about.
#
# session.suspend-timeout-seconds = 0 because a source that something listens
# to continuously must never be suspended: waking it costs the first word.
#
# This file is the only description of the microphone node. It used to be
# split in two -- a stereo "Microphone" rule and this eight-channel one --
# with read order deciding which won. That is carried as one rule instead
# of two, so the node has a
# single source of truth; see the comment left in 51-chiron-audio.conf.
#
# This is that same rule in the syntax WirePlumber
# reads now; see the head of 51-chiron-audio.conf for why the language changed.
# The one thing that did not survive as written is the second alternative
# below. Rule values used to be glob patterns; WirePlumber now hands matching
# to PipeWire's pw_conf_match_rules, where a plain value is compared literally
# and a leading `~` introduces a POSIX regular expression -- so the glob
# `*PDM*` is spelled `~.*PDM.*` here.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.platform-auge_sound.capture.3.0"
      }
      {
        api.alsa.pcm.name = "~.*PDM.*"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 8
        audio.format = "S16LE"
        audio.rate = 48000
        audio.position = "AUX0,AUX1,AUX2,AUX3,AUX4,AUX5,AUX6,AUX7"
        node.description = "Микрофонный массив (8 каналов)"
        node.nick = "Chiron mic array"
        # Highest priority of anything on the board, so it is chosen as
        # the default source. These two lines used to sit in the capture
        # rule of 51-chiron-audio.conf; they moved here with the rest of
        # this node when it was given a single owner.
        priority.driver = 2000
        priority.session = 2000
        session.suspend-timeout-seconds = 0
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
      }
    }
  }
]
