# Chiron audio routing.
#
# The AML-AUGESOUND card exposes three playback PCMs, and only one of them is
# wired to anything:
#
#   device 0  TDM-A-dummy-alsaPORT-pcm     no codec behind it
#   device 1  TDM-B-fs2105-alsaPORT-i2s    the fs2105 amplifier -> speakers
#   device 4  SPDIF-dummy-alsaPORT-spdif   no connector on this board
#   device 5  SPDIF-B-dummy-alsaPORT-spdifb   likewise
#   device 6  EXTN-dummy-alsaPORT-tv          likewise
#
# ALSA's card profile (ACP) picks device 0, so PipeWire's default sink plays
# into a dummy TDM port and the board is silent. Turning ACP off makes
# WirePlumber expose each PCM as its own node, and the two dead ones are then
# hidden so the fs2105 sink is the only thing a user can select.
#
# The rules below are restated in the configuration language WirePlumber
# reads now. Up to 0.4 the monitor was
# configured by appending Lua tables to `alsa_monitor.rules` from files in
# /etc/wireplumber/main.lua.d; 0.5 replaced that with SPA-JSON fragments in
# wireplumber.conf.d, and main.lua.d is no longer looked at. The property names
# and their meanings did not change, and neither did the order the rules are
# applied in: the monitor matches these against the device properties before it
# decides whether to use ACP, and against the node properties before it decides
# whether to create the node, which is what makes both halves of this work.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-auge_sound"
      }
    ]
    actions = {
      update-props = {
        # Without this the vendor card is reduced to a single ACP profile whose
        # playback path is device 0.
        api.alsa.use-acp = false
      }
    }
  },

  # The capture side is the same story. Of the three PCMs that record:
  #
  #   device 2  TDM-C-ES7210 4CH ADC ...-hwfeedback   amplifier current sense
  #   device 3  PDM-dummy-alsaPORT-pdm                the microphone array
  #   device 7  LOOPBACK-A-dummy-alsaPORT-loopback    internal loopback
  #
  # only device 3 has microphones on it: recording four seconds from each gives
  # -31 dB on the PDM and -93 dB and -71 dB on the other two, which is their own
  # noise floor. Left as they are, WirePlumber ends up with no microphone worth
  # choosing and settles on the *sink monitor* as the default source, so anything
  # that asks for "the microphone" -- Firefox, a recorder, a voice call -- records
  # the speakers instead. Hiding the two dead inputs and promoting the PDM is
  # what makes the default source an actual microphone.
  #
  # Hide the PCMs that go nowhere.
  {
    matches = [
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "0"
      }
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "2"
      }
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "4"
      }
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "5"
      }
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "6"
      }
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "7"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },

  # Give the surviving sink a name a person can recognise in a volume applet.
  {
    matches = [
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "1"
        api.alsa.pcm.stream = "playback"
      }
    ]
    actions = {
      update-props = {
        node.description = "Speakers"
        node.nick = "Speakers"
        # Highest priority of anything on the board, so it is chosen as default.
        priority.driver = 2000
        priority.session = 2000
      }
    }
  },

  # The microphone array is deliberately NOT described here. Its node --
  # alsa_input.platform-auge_sound.capture.3.0, PCM device 3 -- is owned
  # entirely by 51-chiron-pdm.conf, which is the single source of truth for it.
  #
  # It used to be described in both files: two channels named "Microphone" here
  # and eight named "Микрофонный массив (8 каналов)" there. Both matched the
  # same node, so the file read last silently decided how many channels the
  # microphone had. That is one node with two answers, and the answer this
  # board needs is the eight-channel one: the array has eight microphones, the
  # wake word downmixes all of them for about 6 dB against uncorrelated noise,
  # and a dead lane -- four dead microphones -- is invisible in a two-channel
  # node.
  #
  # Worth keeping from the measurement that produced the old stereo rule: the
  # PCM advertises up to 64 channels, eight of which carry a microphone and the
  # rest digital silence, and a two-channel open measures the same -31 dB as
  # the eight-channel one. So stereo was never wrong about level -- only about
  # how much of the array it could see.

  # Playback needs headroom; without it the speaker crackles.
  #
  # PipeWire writes into the ALSA ring buffer up to where it believes the
  # hardware pointer is, and with `api.alsa.headroom` at zero -- which is the
  # default -- there is nothing between the last sample written and the sample
  # the DMA engine is about to fetch. On a well-behaved card that is fine. This
  # card reports its pointer in whole periods, so "about to fetch" is accurate to
  # 1024 frames and the tail of every quantum is a race PipeWire sometimes
  # loses; what comes out is a click.
  #
  # 1024 frames at 48 kHz is 21 ms of slack, the same figure the capture side
  # already carries in 51-chiron-pdm.conf, and it is latency nobody can hear on a
  # device that speaks in sentences. It is not a substitute for the audio thread
  # having time to work in -- that was a separate fault, an echo canceller
  # loaded whether or not it was wanted, since removed entirely -- but a graph
  # with no headroom turns any late quantum at all into an audible one.
  {
    matches = [
      {
        api.alsa.card.name = "AML-AUGESOUND"
        api.alsa.pcm.device = "1"
        api.alsa.pcm.stream = "playback"
      }
    ]
    actions = {
      update-props = {
        # The vendor PCM advertises 64 channels. Leaving it unconstrained makes
        # PipeWire open hw:0,1 with 64 channels and reject the physical speaker
        # path before the first stream can play, so the count is pinned here.
        #
        # Two, not three. This file used to ask for three -- FL,FR,LFE -- on
        # the reasoning that the board is a 2.1 and those are its three
        # physical paths. That reasoning does not match the board, and it is
        # not what the accepted configuration does either: it pins
        # period-size and headroom on this node and sets no channel count or
        # position at all.
        #
        # What TDM-B actually carries is a stereo I2S stream, two slots of 32
        # bits, and both amplifiers sit on it together --
        # `sound-dai = <&fs2105_1 &fs2105_0>` with prefix-names woofer,
        # tweeters, one tx-mask between them, and no set_tdm_slot in the
        # fs2105 driver to tell them apart. Each FS2105 is a two-channel codec
        # (channels_min = channels_max = 2), and the woofer/mid-high split is
        # done after the wire, by the AED crossover inside the amplifiers.
        # There is no LFE lane to address.
        #
        # Asking for three channels therefore writes a 12-byte frame into a
        # link that reads 8, every 1024-frame quantum slips, and the channels
        # walk round each other -- FL to FR to LFE and back -- once per
        # quantum. On the board that is a lurch rather than a click, and it is
        # the fault headroom cannot fix: 2048 and 4096, and a 512-frame
        # period, each made it rarer and none of them stopped it, because the
        # frame size was what was wrong. Two channels divide into the frame
        # exactly and it stops.
        #
        # Measured on the board rather than argued from the tree. hw:0,2, the
        # ES7210 the card calls hwfeedback, returns one live channel and it
        # follows slot 0 of TDM-B ahead of the crossover -- a 60 Hz and a 3 kHz
        # tone read the same level through it, so it is watching the bus and
        # not a speaker. Playing speaker-test round the channels once while
        # recording it: at two channels the tone appears in slot 0 once, during
        # FL's turn, and at four channels once, in the same place. At three it
        # appears four times in eight seconds. That is the rotation, and it is
        # the shipped three-channel value that produces it.
        #
        # Four channels is a real configuration -- the PCM reports
        # CHANNELS: [1 4] and FRAME_BITS: [16 128] -- and is as clean as two.
        # What it does not do is reach a second amplifier. The two FS2105s
        # differ in four of 256 registers: 0x0f, which is each one's own I2C
        # address, and 0x15, 0x28 and 0x48, which hold the vendor preset that
        # makes one of them a woofer. Nothing there selects a TDM slot, the
        # driver has no set_tdm_slot, and both sit on one tx-mask, so both read
        # the same two slots and the split happens afterwards in their DSP. A
        # 60 Hz tone sent to the LFE slot alone at four channels put nothing on
        # the bus monitor. A four-channel file does make the woofer play
        # where stereo does not; nothing measured here accounts for that, and
        # until it does, the value that ships is the one the hardware is
        # actually wired for.
        audio.channels = 2
        audio.position = "FL,FR"
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
      }
    }
  }
]
