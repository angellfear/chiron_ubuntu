# Seed settings for the desktop, copied into the account by chiron-firstboot
# as ~/.config/pcmanfm-qt/default/settings.conf and never refreshed after that
# -- everything else in that file is whatever the person changed in Desktop
# Preferences, and an image update has no business overwriting it.
#
# Only the wallpaper is set here, and only so that a board which never rotates
# still has one: chiron-autorotate sets it again, per orientation, every time
# the hinge moves, and that is the copy that matters in normal use. Portrait is
# the value here because that is the detent the panel sits at when it is not
# being held.
#
# zoom is pcmanfm-qt's fill-and-crop: the picture covers the screen and the
# overhang is cut, never stretched. The two shipped images are drawn at the
# ratio of each detent, so at the matching orientation nothing is cut either.
[Desktop]
Wallpaper=/usr/local/share/chiron/wallpaper-portrait.png
WallpaperMode=zoom

# One tap opens. The default asks for a double click, which is a mouse gesture:
# on this board the only pointing device is a finger, and the desktop's own
# icons are the one place a person meets it.
[Behavior]
SingleClick=true

# pcmanfm-qt defaults this to oxygen, which is not installed here, so nothing
# on the desktop had an icon -- not the launchers, not the files. Adwaita is
# the only theme in the image.
[System]
FallbackIconThemeName=Adwaita
