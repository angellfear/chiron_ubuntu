# The V4L2 loopback module, the public camera node. The vendor ISP does not
# recover from STREAMOFF, so one hardware stream is held open and republished
# through this, which browsers can open and close freely. Pinned at 0.12.7,
# the accepted release -- its module parameters are what the
# udev rules and the bridge in this image expect. The commit is the one tag
# v0.12.7 points at: the ref has to name a branch because prepare_tree derives
# the local branch name from it, and a tag's own object id is not a commit.
V4L2LOOPBACK_URL=https://github.com/umlaeute/v4l2loopback.git
V4L2LOOPBACK_REF=refs/heads/main
V4L2LOOPBACK_COMMIT=1ecf810f0d687b647caa3050ae30cf51b5902afd

# OP-TEE normal-world client. Android's tee-supplicant and libteec are
# bionic-linked and cannot run here, so the same protocol is built against
# glibc from upstream at the accepted commit.
OPTEE_CLIENT_URL=https://github.com/OP-TEE/optee_client.git
OPTEE_CLIENT_REF=refs/heads/master
OPTEE_CLIENT_COMMIT=ab96380ccab2e6710d873093db6552f7f5018e47

# Amlogic vendor userspace for the hardware video path, from the Khadas
# repository. These are binary vendor packages with no source to build, so they
# are pinned the way the git trees are pinned by commit: by URL and SHA-256.
# They are not put into the image: assemble-output.sh writes these pins into
# it, and chiron-vendor-fetch downloads the packages on the board.
#
# Five of the seven are the exact files accepted before, checksum
# for checksum. libamvenc and libmultienc are the ~noble rebuilds of the same
# upstream versions -- the .deb wrappers differ, every file inside them is
# byte-identical to the accepted copies, verified by unpacking both.
VENDOR_DEB_BASE=http://dl.khadas.com/repos/vim4/pool/main

VENDOR_DEB_ION=libi/libion/libion_0.4-202406_arm64.deb
VENDOR_DEB_ION_SHA256=7eb8eb41e0a97a10a3f434afd06778a2b22480ec004e20beedfe60c3877a50fc

